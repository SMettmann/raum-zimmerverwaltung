name: Code Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check core.js
          node --check requirements.js
          node --check xrechnung.js
          node --check cleaning-v2.js
          node --check cleaning-history-expand.js
          node --check live-test-fixes.js
          node --check live-test-fixes-round-two.js
          node --check completion.js
          node --check availability-simple.js
          node --check time-booking.js
          node --check password-management.js
          node --check manage.js
          node --check public-booking.js
          node --check brand-override.js
          node --check group-booking-board.js
          node --check tests/generate-xrechnung-sample.cjs
          node --check tests/cleaning-v2-smoke.cjs
          node --check tests/live-test-round-one-smoke.cjs
          node --check tests/live-test-round-two-smoke.cjs
          node --check tests/requirements-complete-smoke.cjs
          node --check tests/production-safety-smoke.mjs
          node --check tests/login-audit-smoke.mjs
          node --check tests/admin-audit-ui-smoke.mjs
          node --check tests/public-rate-limit-smoke.mjs
          node --check tests/simple-blocking-smoke.cjs
          node --check tests/time-booking-smoke.mjs
          node --check tests/booking-email-smoke.mjs
          node --check tests/password-management-smoke.mjs
          node --check worker/index.js
          node --check worker/entry.js
          node --check worker/time-entry.js
          node --check worker/email-entry.js
          node --check worker/password-entry.js
          node --check worker/owner-protection-entry.js
          node --check worker/time-booking.mjs
          node --check worker/booking-email.mjs
          node --check worker/state-permissions.mjs
          node --check worker/public-rate-limit.mjs
      - name: Cleaning V2 smoke test
        run: node tests/cleaning-v2-smoke.cjs
      - name: Live test round one smoke test
        run: node tests/live-test-round-one-smoke.cjs
      - name: Live test round two smoke test
        run: node tests/live-test-round-two-smoke.cjs
      - name: Tender requirements smoke test
        run: node tests/requirements-complete-smoke.cjs
      - name: Production safety smoke test
        run: node tests/production-safety-smoke.mjs
      - name: Login and audit smoke test
        run: node tests/login-audit-smoke.mjs
      - name: Admin and audit UI smoke test
        run: node tests/admin-audit-ui-smoke.mjs
      - name: Public booking rate limit smoke test
        run: node tests/public-rate-limit-smoke.mjs
      - name: Simple blocking smoke test
        run: node tests/simple-blocking-smoke.cjs
      - name: Timed seminar booking smoke test
        run: node tests/time-booking-smoke.mjs
      - name: Automatic booking email smoke test
        run: node tests/booking-email-smoke.mjs
      - name: Password management smoke test
        run: node tests/password-management-smoke.mjs
      - name: Install Wrangler
        run: npm install
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run