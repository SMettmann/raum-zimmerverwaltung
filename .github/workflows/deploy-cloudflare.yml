name: Deploy RAUMWERK to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 052d7f71d20fa4874466d1b236ed358e
      RAUMWERK_URL: https://raumwerk.mettmannsven8.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required Cloudflare secret
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
      - name: Install Wrangler
        run: npm install
      - name: Apply database schema
        run: npx wrangler d1 execute raumwerk-db --remote --file=./schema.sql --config wrangler.jsonc --yes
      - name: Deploy Worker and application
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify authentication API
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl --silent --show-error --fail "$RAUMWERK_URL/api/bootstrap/status")" && break
            sleep 2
          done
          echo "$STATUS" | grep -q '"needsSetup"'
          HTTP_CODE="$(curl --silent --output /tmp/me.json --write-out '%{http_code}' "$RAUMWERK_URL/api/me")"
          test "$HTTP_CODE" = "401"
          echo "RAUMWERK authentication API is reachable. bootstrap=$STATUS; unauthenticated /api/me=$HTTP_CODE"
