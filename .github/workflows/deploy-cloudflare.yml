name: Deploy RAUMWERK to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RAUMWERK_D1_DATABASE_ID: ${{ secrets.RAUMWERK_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)
          test -n "$RAUMWERK_D1_DATABASE_ID" || (echo 'Missing RAUMWERK_D1_DATABASE_ID' && exit 1)
      - name: Install Wrangler
        run: npm install
      - name: Build deployment config
        run: |
          node -e "const fs=require('fs');const p='wrangler.jsonc';let s=fs.readFileSync(p,'utf8');s=s.replace('REPLACE_WITH_D1_DATABASE_ID',process.env.RAUMWERK_D1_DATABASE_ID);fs.writeFileSync('wrangler.deploy.jsonc',s)"
      - name: Apply database schema
        run: npx wrangler d1 execute raumwerk-db --remote --file=./schema.sql --config wrangler.deploy.jsonc --yes
      - name: Deploy Worker and application
        run: npx wrangler deploy --config wrangler.deploy.jsonc
