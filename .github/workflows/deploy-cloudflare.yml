name: Deploy RAUMWERK to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 052d7f71d20fa4874466d1b236ed358e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required Cloudflare secret
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
      - name: Install Wrangler
        run: npm install
      - name: Apply database schema
        run: npx wrangler d1 execute raumwerk-db --remote --file=./schema.sql --config wrangler.jsonc --yes
      - name: Deploy Worker and application
        run: npx wrangler deploy --config wrangler.jsonc
