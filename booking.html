<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online-Buchung – RAUMWERK</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:920px;margin:0 auto;padding:30px 18px 60px}.brand{font-weight:900;font-size:22px;margin-bottom:28px}.brand small{display:block;font-size:12px;color:#7d8798;margin-top:4px}.hero{background:#172033;color:white;border-radius:20px;padding:30px;margin-bottom:20px}.hero h1{margin:0 0 8px}.hero p{color:#cbd4e2;max-width:650px}.panel{background:white;border:1px solid #e2e7ef;border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 8px 30px #1720330b}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9e0ea;border-radius:10px;font:inherit}.field textarea{min-height:90px}.btn{border:0;background:#335cff;color:#fff;padding:12px 16px;border-radius:10px;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:#172033;border:1px solid #d9e0ea}.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}.room{border:1px solid #dfe5ee;border-radius:13px;padding:15px;cursor:pointer;background:#fff}.room.active{border-color:#335cff;box-shadow:0 0 0 2px #335cff22}.room.off{opacity:.45;pointer-events:none}.room h3{margin:0 0 5px}.muted{color:#758097;font-size:13px}.notice{padding:12px;border-radius:10px;background:#eef3ff;color:#294ab6;font-size:13px}.error{display:none;background:#fff0f0;color:#a42d2d;padding:12px;border-radius:10px;margin:12px 0}.success{display:none;background:#e9f9ef;color:#176b43;padding:16px;border-radius:12px;margin:12px 0}.honeypot{position:absolute;left:-9999px}@media(max-width:700px){.two,.rooms{grid-template-columns:1fr}.hero{padding:22px}}
</style>
</head>
<body><div class="wrap"><div class="brand">RAUMWERK<small id="orgName">Online-Buchung</small></div><div class="hero"><h1>Raum oder Zimmer anfragen</h1><p>Zeitraum auswählen, freien Raum wählen und Anfrage senden. Die Einrichtung bestätigt anschließend die Buchung.</p></div><div class="panel"><h2>1. Zeitraum</h2><div class="two"><div class="field"><label>Von</label><input id="from" type="date"></div><div class="field"><label>Bis</label><input id="to" type="date"></div></div><button class="btn secondary" onclick="checkAvailability()">Verfügbarkeit prüfen</button><div id="availabilityNote" class="notice" style="margin-top:14px">Bitte zuerst einen Zeitraum wählen.</div><div class="rooms" id="rooms"></div></div><div class="panel"><h2>2. Kontaktdaten</h2><div class="error" id="error"></div><div class="success" id="success"></div><div class="field"><label>Name / Organisation *</label><input id="name"></div><div class="two"><div class="field"><label>E-Mail *</label><input id="email" type="email"></div><div class="field"><label>Telefon</label><input id="phone"></div></div><div class="two"><div class="field"><label>Zweck</label><input id="purpose" placeholder="z. B. Seminar, Übernachtung"></div><div class="field"><label>Teilnehmer</label><input id="participants" type="number" min="1" value="1"></div></div><div class="field"><label>Nachricht</label><textarea id="note"></textarea></div><div class="honeypot"><label>Website<input id="website"></label></div><button class="btn" onclick="sendRequest()">Buchungsanfrage senden</button></div></div><script src="public-booking.js"></script></body></html>
