<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raum- & Zimmerverwaltung</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#172033;color:#fff;padding:28px 18px}.brand{font-size:21px;font-weight:800;margin-bottom:34px}.brand small{display:block;color:#9eabc0;font-size:12px;margin-top:5px}.nav button{width:100%;border:0;background:transparent;color:#cbd3df;text-align:left;padding:12px 14px;border-radius:10px;margin:3px 0;font-size:14px}.nav button.active{background:#2b3850;color:#fff}.main{padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:28px}.top p{color:#778197;margin:6px 0 0}.primary{background:#335cff;color:#fff;border:0;padding:11px 17px;border-radius:10px;font-weight:700;cursor:pointer}.secondary{border:1px solid #dce1e8;background:#fff;padding:10px 15px;border-radius:9px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}.card,.panel{background:#fff;border:1px solid #e7eaf0;border-radius:15px;padding:20px;box-shadow:0 4px 18px #18233a0b}.metric{font-size:30px;font-weight:800;margin-top:9px}.muted{color:#7b8497;font-size:13px}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px}.room,.booking{display:flex;justify-content:space-between;gap:16px;align-items:center;border-top:1px solid #edf0f4;padding:15px 0}.room:first-of-type,.booking:first-of-type{border-top:0}.badge{padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700}.free{background:#e8f8ef;color:#197247}.busy{background:#fff0e8;color:#ad4b1d}.clean{background:#fff7dc;color:#8a6800}.event{border-left:3px solid #335cff;padding:8px 12px;margin:12px 0}.modal{display:none;position:fixed;inset:0;background:#11182799;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{background:#fff;width:min(580px,96vw);border-radius:16px;padding:24px;max-height:94vh;overflow:auto}.box h2{margin-top:0}.box input,.box select,.box textarea{width:100%;padding:11px;border:1px solid #dce1e8;border-radius:9px;margin:6px 0 14px;font:inherit}.box textarea{min-height:80px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;justify-content:flex-end;gap:8px}.hint{padding:11px 13px;border-radius:10px;background:#eef3ff;color:#2749c7;font-size:13px;margin-bottom:14px}.error{display:none;padding:11px 13px;border-radius:10px;background:#fff0f0;color:#a12d2d;font-size:13px;margin-bottom:14px}.empty{padding:18px 0;color:#7b8497}.booking-meta{font-size:12px;color:#7b8497;margin-top:4px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.main{padding:20px}}@media(max-width:500px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;gap:14px;flex-direction:column}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand">RAUMWERK<small>Raum- & Zimmerverwaltung</small></div><div class="nav"><button class="active">▦ Dashboard</button><button>▣ Buchungskalender</button><button>⌂ Räume & Zimmer</button><button>♙ Gäste & Kunden</button><button>✓ Reinigung</button><button>☑ Aufgaben</button><button>▤ Dokumente</button><button>⚙ Einstellungen</button></div></aside>
<main class="main"><div class="top"><div><h1>Dashboard</h1><p id="date"></p></div><button class="primary" onclick="openModal()">+ Neue Buchung</button></div>
<section class="cards"><div class="card"><span class="muted">Räume gesamt</span><div class="metric" id="total">8</div></div><div class="card"><span class="muted">Heute belegt</span><div class="metric" id="occupied">0</div></div><div class="card"><span class="muted">Heute frei</span><div class="metric" id="available">0</div></div><div class="card"><span class="muted">Buchungen gesamt</span><div class="metric" id="bookingCount">0</div></div></section>
<section class="grid"><div class="panel"><h2>Räume & Zimmer</h2><div id="rooms"></div></div><div class="panel"><h2>Aktuelle Buchungen</h2><div id="bookings"></div></div></section></main></div>
<div class="modal" id="modal"><div class="box"><h2>Neue Buchung</h2><div class="hint">Nur freie Zeiträume können gebucht werden. Doppelbelegungen werden automatisch verhindert.</div><div class="error" id="bookingError"></div><label>Gast / Kunde *</label><input id="guest" placeholder="z. B. Max Mustermann"><label>Raum / Zimmer *</label><select id="roomSelect"></select><div class="two"><div><label>Von *</label><input id="dateFrom" type="date"></div><div><label>Bis *</label><input id="dateTo" type="date"></div></div><label>Zweck / Veranstaltung</label><input id="purpose" placeholder="z. B. Seminar, Übernachtung, Besprechung"><label>Teilnehmerzahl</label><input id="participants" type="number" min="1" placeholder="z. B. 12"><label>Notiz</label><textarea id="note" placeholder="Optional"></textarea><div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="book()">Buchung speichern</button></div></div></div>
<script>
const rooms=[{id:1,name:'Seminarraum Luther',type:'Seminarraum'},{id:2,name:'Seminarraum Melanchthon',type:'Seminarraum'},{id:3,name:'Besprechungsraum 1',type:'Besprechungsraum'},{id:4,name:'Gästezimmer 201',type:'Einzelzimmer'},{id:5,name:'Gästezimmer 202',type:'Doppelzimmer'},{id:6,name:'Gästezimmer 203',type:'Einzelzimmer'},{id:7,name:'Gästezimmer 204',type:'Doppelzimmer'},{id:8,name:'Gruppenraum',type:'Veranstaltungsraum'}];
let bookings=JSON.parse(localStorage.getItem('raumwerk_bookings')||'[]');
const isoToday=()=>new Date().toISOString().slice(0,10);
const overlaps=(aFrom,aTo,bFrom,bTo)=>aFrom<=bTo&&aTo>=bFrom;
const roomBookedOn=(roomId,date)=>bookings.some(b=>b.roomId===roomId&&b.from<=date&&b.to>=date);
const roomHasConflict=(roomId,from,to)=>bookings.some(b=>b.roomId===roomId&&overlaps(from,to,b.from,b.to));
const formatDate=d=>new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'));
function render(){const today=isoToday();const r=document.getElementById('rooms');const s=document.getElementById('roomSelect');r.innerHTML='';s.innerHTML='';rooms.forEach(x=>{const busy=roomBookedOn(x.id,today);r.innerHTML+=`<div class="room"><div><b>${x.name}</b><div class="muted">${x.type}</div></div><span class="badge ${busy?'busy':'free'}">${busy?'Heute belegt':'Heute frei'}</span></div>`;s.innerHTML+=`<option value="${x.id}">${x.name}</option>`});const occupied=rooms.filter(x=>roomBookedOn(x.id,today)).length;document.getElementById('occupied').textContent=occupied;document.getElementById('available').textContent=rooms.length-occupied;document.getElementById('total').textContent=rooms.length;document.getElementById('bookingCount').textContent=bookings.length;renderBookings()}
function renderBookings(){const wrap=document.getElementById('bookings');const sorted=[...bookings].sort((a,b)=>a.from.localeCompare(b.from));if(!sorted.length){wrap.innerHTML='<div class="empty">Noch keine Buchung gespeichert.</div>';return}wrap.innerHTML=sorted.map(b=>{const room=rooms.find(r=>r.id===b.roomId);return `<div class="booking"><div><b>${b.guest}</b><div>${room?room.name:'Raum'}</div><div class="booking-meta">${formatDate(b.from)} – ${formatDate(b.to)}${b.purpose?' · '+b.purpose:''}${b.participants?' · '+b.participants+' Pers.':''}</div></div><span class="badge busy">Gebucht</span></div>`}).join('')}
function openModal(){document.getElementById('bookingError').style.display='none';document.getElementById('dateFrom').value=isoToday();document.getElementById('dateTo').value=isoToday();document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function showError(msg){const e=document.getElementById('bookingError');e.textContent=msg;e.style.display='block'}
function book(){const roomId=Number(document.getElementById('roomSelect').value);const guest=document.getElementById('guest').value.trim();const from=document.getElementById('dateFrom').value;const to=document.getElementById('dateTo').value;const purpose=document.getElementById('purpose').value.trim();const participants=Number(document.getElementById('participants').value)||null;const note=document.getElementById('note').value.trim();if(!guest||!roomId||!from||!to)return showError('Bitte Gast/Kunde, Raum und Zeitraum vollständig angeben.');if(to<from)return showError('Das Bis-Datum darf nicht vor dem Von-Datum liegen.');if(roomHasConflict(roomId,from,to)){const room=rooms.find(r=>r.id===roomId);return showError(`${room.name} ist in diesem Zeitraum bereits gebucht. Bitte anderen Zeitraum oder Raum wählen.`)}bookings.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),roomId,guest,from,to,purpose,participants,note,createdAt:new Date().toISOString()});localStorage.setItem('raumwerk_bookings',JSON.stringify(bookings));closeModal();document.getElementById('guest').value='';document.getElementById('purpose').value='';document.getElementById('participants').value='';document.getElementById('note').value='';render();alert('Buchung gespeichert.')}
document.getElementById('date').textContent=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date());render();
</script>
</body></html>
