<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raum- & Zimmerverwaltung</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#172033;color:white;padding:28px 18px}.brand{font-size:21px;font-weight:800;margin-bottom:34px}.brand small{display:block;color:#9eabc0;font-size:12px;margin-top:5px}.nav button{width:100%;border:0;background:transparent;color:#cbd3df;text-align:left;padding:12px 14px;border-radius:10px;margin:3px 0;font-size:14px}.nav button.active{background:#2b3850;color:#fff}.main{padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:28px}.top p{color:#778197;margin:6px 0 0}.primary{background:#335cff;color:#fff;border:0;padding:11px 17px;border-radius:10px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}.card,.panel{background:white;border:1px solid #e7eaf0;border-radius:15px;padding:20px;box-shadow:0 4px 18px #18233a0b}.metric{font-size:30px;font-weight:800;margin-top:9px}.muted{color:#7b8497;font-size:13px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.room{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf0f4;padding:15px 0}.room:first-of-type{border-top:0}.badge{padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700}.free{background:#e8f8ef;color:#197247}.busy{background:#fff0e8;color:#ad4b1d}.clean{background:#fff7dc;color:#8a6800}.event{border-left:3px solid #335cff;padding:8px 12px;margin:12px 0}.modal{display:none;position:fixed;inset:0;background:#11182799;align-items:center;justify-content:center}.modal.show{display:flex}.box{background:white;width:min(470px,92vw);border-radius:16px;padding:24px}.box input,.box select{width:100%;padding:11px;border:1px solid #dce1e8;border-radius:9px;margin:6px 0 14px}.actions{display:flex;justify-content:flex-end;gap:8px}.secondary{border:1px solid #dce1e8;background:white;padding:10px 15px;border-radius:9px}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{display:none}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.main{padding:20px}}@media(max-width:500px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;gap:14px;flex-direction:column}}
</style>
</head>
<body><div class="shell"><aside class="side"><div class="brand">RAUMWERK<small>Raum- & Zimmerverwaltung</small></div><div class="nav"><button class="active">▦ Dashboard</button><button>▣ Buchungskalender</button><button>⌂ Räume & Zimmer</button><button>♙ Gäste & Kunden</button><button>✓ Reinigung</button><button>☑ Aufgaben</button><button>▤ Dokumente</button><button>⚙ Einstellungen</button></div></aside><main class="main"><div class="top"><div><h1>Dashboard</h1><p id="date"></p></div><button class="primary" onclick="openModal()">+ Neue Buchung</button></div><section class="cards"><div class="card"><span class="muted">Räume gesamt</span><div class="metric" id="total">8</div></div><div class="card"><span class="muted">Heute belegt</span><div class="metric" id="occupied">3</div></div><div class="card"><span class="muted">Heute frei</span><div class="metric" id="available">4</div></div><div class="card"><span class="muted">Reinigung offen</span><div class="metric">1</div></div></section><section class="grid"><div class="panel"><h2>Räume & Zimmer</h2><div id="rooms"></div></div><div class="panel"><h2>Heute</h2><div class="event"><b>08:00 – 12:00</b><br>Seminarraum Luther<br><span class="muted">Workshop · 18 Personen</span></div><div class="event"><b>14:00 – 16:00</b><br>Besprechungsraum 1<br><span class="muted">Teammeeting</span></div><div class="event"><b>Ab 15:00</b><br>Gästezimmer 203<br><span class="muted">Anreise · M. Schneider</span></div></div></section></main></div><div class="modal" id="modal"><div class="box"><h2>Neue Buchung</h2><label>Gast / Kunde</label><input id="guest" placeholder="Name"><label>Raum / Zimmer</label><select id="roomSelect"></select><label>Datum</label><input id="bookingDate" type="date"><div class="actions"><button class="secondary" onclick="closeModal()">Abbrechen</button><button class="primary" onclick="book()">Buchung speichern</button></div></div></div><script>
const defaults=[{id:1,name:'Seminarraum Luther',type:'Seminarraum',status:'busy'},{id:2,name:'Seminarraum Melanchthon',type:'Seminarraum',status:'free'},{id:3,name:'Besprechungsraum 1',type:'Besprechungsraum',status:'busy'},{id:4,name:'Gästezimmer 201',type:'Einzelzimmer',status:'free'},{id:5,name:'Gästezimmer 202',type:'Doppelzimmer',status:'clean'},{id:6,name:'Gästezimmer 203',type:'Einzelzimmer',status:'busy'},{id:7,name:'Gästezimmer 204',type:'Doppelzimmer',status:'free'},{id:8,name:'Gruppenraum',type:'Veranstaltungsraum',status:'free'}];
let rooms=JSON.parse(localStorage.getItem('raumwerk_rooms')||'null')||defaults;const labels={free:'Frei',busy:'Belegt',clean:'Reinigung'};function render(){let r=document.getElementById('rooms'),s=document.getElementById('roomSelect');r.innerHTML='';s.innerHTML='';rooms.forEach(x=>{r.innerHTML+=`<div class="room"><div><b>${x.name}</b><div class="muted">${x.type}</div></div><span class="badge ${x.status}">${labels[x.status]}</span></div>`;if(x.status==='free')s.innerHTML+=`<option value="${x.id}">${x.name}</option>`});document.getElementById('occupied').textContent=rooms.filter(x=>x.status==='busy').length;document.getElementById('available').textContent=rooms.filter(x=>x.status==='free').length}function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function book(){let id=+document.getElementById('roomSelect').value,g=document.getElementById('guest').value.trim();if(!id||!g)return alert('Bitte Gast/Kunde und Raum auswählen.');let x=rooms.find(x=>x.id===id);x.status='busy';localStorage.setItem('raumwerk_rooms',JSON.stringify(rooms));closeModal();render();alert('Buchung für '+g+' gespeichert.')}document.getElementById('date').textContent=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date());document.getElementById('bookingDate').value=new Date().toISOString().slice(0,10);render();
</script></body></html>
